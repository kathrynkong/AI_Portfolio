<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cats, Riddles &amp; Procedural Play</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
</head>
<body>
    <button id="restart-btn" onclick="restartGame()" style="display:none; position:fixed; top:20px; right:20px; z-index:10; padding:10px 18px; font-size:1em; cursor:pointer; background:#ff69b4; color:white; border:none; border-radius:6px;">Play Again</button>
    <script>
        let catImage;
        let catZones = [];
        let doorZones = [];
        let message = "";
        let messageTimer = 0;
        let choices = [];
        let points = 0;
        let glowingBall;
        let showGlowingBall = false;
        let ballSource = null; // which reward spawned the current glowing ball ('ball' | 'star')
        let activeCatIndex = -1; // which cat's dialogue is currently open
        let claimedRewards = new Set(); // one-time reward keys already collected
        let gameEnded = false;
        let activeInteraction = null; // 'riddle' while the right cat's riddle choices are on screen
        let currentRiddle = null; // riddle picked fresh each time the right cat is approached

        // --- Procedural text generation -----------------------------------
        // Dialogue is assembled at runtime from small word banks and a
        // riddle pool instead of being fixed strings, so replaying the game
        // (or just re-visiting a cat) produces different phrasing/puzzles.
        const flavorBanks = {
            cosmosNouns: ["comet's tail", "morning star", "aurora's edge", "midnight glow", "wandering nebula"],
            skyAdjectives: ["shimmering", "silver-veined", "frost-lit", "star-flecked", "cloud-wreathed"],
            forestNouns: ["golden leaf", "moonlit spring", "whispering root", "silver acorn"],
            forestAdjectives: ["moss-cloaked", "sunlit", "tangled", "fern-shadowed"],
            purrs: [
                "The cat purrs loudly, leaning into your touch. \"Hmm, you know how to treat royalty! Maybe I'll help you on your journey.\"",
                "The cat headbutts your hand and rumbles with a deep, satisfied purr. \"Not bad, for a wingless one.\"",
                "The cat stretches luxuriously under your hand. \"Careful — I could get used to this.\""
            ]
        };

        const riddleBank = [
            { question: "What shines in the darkness but can never be held?", correct: "A Star", distractors: ["The Moon", "A Flame"] },
            { question: "What grows brighter the longer you look away from it?", correct: "A Star", distractors: ["A Shadow", "A Candle"] },
            { question: "What falls from the sky each night, yet nothing ever lands?", correct: "Starlight", distractors: ["Rain", "Snow"] }
        ];

        const riddleWrongFlavor = [
            "\"Close,\" the cat purrs, \"but think again, seeker.\"",
            "The cat tilts its head. \"Not quite what the stars whisper to me.\"",
            "\"A fair guess,\" the cat says, \"but the Starry Abyss wants better.\""
        ];

        function pick(list) {
            return list[Math.floor(random(list.length))];
        }

        function shuffleArray(list) {
            const result = list.slice();
            for (let i = result.length - 1; i > 0; i--) {
                const j = Math.floor(random(i + 1));
                [result[i], result[j]] = [result[j], result[i]];
            }
            return result;
        }

        function generateSkyMessage() {
            return `Bring me the ${pick(flavorBanks.cosmosNouns)}, and I shall grant you the ${pick(flavorBanks.skyAdjectives)} Sky Palace's secret.`;
        }

        function generateForestMessage() {
            return `Chase the ball, and the ${pick(flavorBanks.forestAdjectives)} Enchanted Forest will open its heart to you.`;
        }

        function generateForestLore() {
            return `The Enchanted Forest is full of secrets. Bring me a ${pick(flavorBanks.forestNouns)}, and I might tell you more.`;
        }

        function generateSkyLore() {
            return `The Sky Palace floats among the ${pick(flavorBanks.skyAdjectives)} clouds, home to those who dare to reach for the stars.`;
        }

        function pickRiddle() {
            currentRiddle = riddleBank[Math.floor(random(riddleBank.length))];
        }

        function preload() {
            catImage = loadImage('cat.png');
        }

        function setup() {
            let canvas = createCanvas(1000, 1000);
            canvas.parent(document.body);
            canvas.style('display', 'block'); // To ensure the canvas is centered

            // Define interaction zones for cats (x, y, width, height)
            catZones.push({ x: 88.5, y: 793, w: 148, h: 169, name: 'Left Cat' }); // Left cat
            catZones.push({ x: 400.5, y: 693, w: 283, h: 269, name: 'Middle Cat' }); // Middle cat
            catZones.push({ x: 712.5, y: 789, w: 236, h: 191, name: 'Right Cat' }); // Right cat

            // Define interaction zones for doors (x, y, width, height)
            doorZones.push({ x: 100.5, y: 329, w: 224, h: 445, name: 'Left Door' }); // Left door
            doorZones.push({ x: 403.5, y: 335, w: 208, h: 440, name: 'Middle Door' }); // Middle door
            doorZones.push({ x: 697.5, y: 336, w: 197, h: 442, name: 'Right Door' }); // Right door
        }

        function draw() {
            if (gameEnded) {
                // Blur the background
                drawingContext.filter = 'blur(5px)';
            } else {
                drawingContext.filter = 'none';
            }

            // Clear background and draw main canvas elements
            background(catImage);

            // Reset drawing properties to avoid unwanted transformations
            rectMode(CORNER);
            textAlign(LEFT, TOP);
            textSize(24);
            fill(255, 100, 150);
            noStroke();

            let catZoneHighlighted = false;

            // Highlight interaction zones on mouseover and display zone names
            for (let zone of catZones) {
                if (isMouseOverZone(zone)) {
                    fill(255, 200, 200, 150);
                    rect(zone.x, zone.y, zone.w, zone.h);
                    displayZoneName(zone.name);
                    catZoneHighlighted = true;
                }
            }

            // Only display door zones if no cat zone is highlighted
            let doorZoneHighlighted = false;
            if (!catZoneHighlighted) {
                for (let zone of doorZones) {
                    if (isMouseOverZone(zone)) {
                        fill(200, 255, 200, 150);
                        rect(zone.x, zone.y, zone.w, zone.h);
                        displayZoneName(zone.name);
                        doorZoneHighlighted = true;
                    }
                }
            }

            // Show a hand cursor whenever the mouse is over something clickable
            cursor(catZoneHighlighted || doorZoneHighlighted || isOverChoice() || isOverGlowingBall() ? HAND : ARROW);

            // Display mouse coordinates
            displayCoordinates();

            // Display message if present
            if (messageTimer > 0) {
                displayMessage(message);
                messageTimer--;
            }

            // Display choices if present
            if (choices.length > 0) {
                displayChoices();
            }

            // Display glowing ball if active
            if (showGlowingBall) {
                fill(255, 255, 0);
                ellipse(glowingBall.x, glowingBall.y, 50);
            }

            // Display points
            fill(0);
            textAlign(LEFT, TOP);
            text(`Points: ${points}`, 10, 10);

            // Check if game has ended
            if (points >= 15 && !gameEnded) {
                endGame();
            }

            // Display end screen if game has ended
            if (gameEnded) {
                drawingContext.filter = 'none'; // Remove blur for the text
                displayEndScreen();
            }
        }

        function isMouseOverZone(zone) {
            return mouseX > zone.x && mouseX < zone.x + zone.w && mouseY > zone.y && mouseY < zone.y + zone.h;
        }

        function isOverChoice() {
            for (let i = 0; i < choices.length; i++) {
                let choiceY = height / 2 + 100 + i * 40;
                if (mouseX > width / 2 - 200 && mouseX < width / 2 + 200 && mouseY > choiceY - 20 && mouseY < choiceY + 20) {
                    return true;
                }
            }
            return false;
        }

        function isOverGlowingBall() {
            return showGlowingBall && dist(mouseX, mouseY, glowingBall.x, glowingBall.y) < 25;
        }

        function mousePressed() {
            if (gameEnded) return; // Stop interactions if game has ended

            // Handle mouse interactions
            let choiceHandled = false;

            // Handle clicking on choices
            for (let i = 0; i < choices.length; i++) {
                let choiceY = height / 2 + 100 + i * 40;
                if (mouseX > width / 2 - 200 && mouseX < width / 2 + 200 && mouseY > choiceY - 20 && mouseY < choiceY + 20) {
                    handleChoice(choices[i]);
                    choiceHandled = true;
                    return;
                }
            }

            // If choice is handled, do not process further clicks
            if (choiceHandled) return;

            // Handle mouse click interactions with cat zones
            for (let i = 0; i < catZones.length; i++) {
                if (isMouseOverZone(catZones[i])) {
                    activeCatIndex = i;
                    switch (i) {
                        case 0:
                            activeInteraction = 'dialogue';
                            message = generateSkyMessage();
                            choices = [
                                "Chase a Falling Star",
                                "Ask About the Sky Palace",
                                "Pet the Cat"
                            ];
                            break;
                        case 1:
                            activeInteraction = 'dialogue';
                            message = generateForestMessage();
                            choices = [
                                "Play with the Ball",
                                "Ask About the Forest",
                                "Pet the Cat"
                            ];
                            break;
                        case 2:
                            activeInteraction = 'riddle';
                            pickRiddle(); // a new riddle each time you approach
                            message = currentRiddle.question;
                            choices = shuffleArray([currentRiddle.correct, ...currentRiddle.distractors]);
                            break;
                    }
                    messageTimer = 180; // Display message for 3 seconds
                }
            }

            // Handle mouse click interactions with door zones
            for (let i = 0; i < doorZones.length; i++) {
                if (isMouseOverZone(doorZones[i])) {
                    switch (i) {
                        case 0:
                            message = "Only those who catch the falling stars may enter the Sky Palace. Dare to chase the light of the heavens?";
                            break;
                        case 1:
                            message = "Follow the glow into the Enchanted Forest. Only those with the courage to uncover the truth may pass.";
                            break;
                        case 2:
                            message = "Answer the riddle to unlock the Starry Abyss. What shines in the darkness but can never be held?";
                            break;
                    }
                    messageTimer = 180; // Display message for 3 seconds
                    choices = []; // Clear choices for doors
                }
            }

            // Handle clicking on glowing ball
            if (showGlowingBall && dist(mouseX, mouseY, glowingBall.x, glowingBall.y) < 25) {
                showGlowingBall = false;
                if (ballSource && !claimedRewards.has(ballSource)) {
                    claimedRewards.add(ballSource);
                    points += 10;
                }
                ballSource = null;
            }
        }

        function handleChoice(choice) {
            if (activeInteraction === 'riddle') {
                handleRiddleChoice(choice);
            } else {
                switch (choice) {
                    case "Play with the Ball":
                        if (claimedRewards.has('ball')) {
                            message = "Ginger just watches you now — you've already played fetch with her today.";
                        } else {
                            message = "Ginger bats a glowing ball toward you, her eyes sparkling with excitement.";
                            glowingBall = { x: width / 2, y: 100 };
                            showGlowingBall = true;
                            ballSource = 'ball';
                        }
                        break;
                    case "Ask About the Forest":
                        message = generateForestLore();
                        break;
                    case "Pet the Cat": {
                        const petKey = `pet-${activeCatIndex}`;
                        if (claimedRewards.has(petKey)) {
                            message = "The cat headbutts your hand affectionately, but has nothing new to share.";
                        } else {
                            message = pick(flavorBanks.purrs);
                            points += 5;
                            claimedRewards.add(petKey);
                        }
                        break;
                    }
                    case "Chase a Falling Star":
                        if (claimedRewards.has('star')) {
                            message = "The sky is calm now — you've already claimed your falling star.";
                        } else {
                            message = "A star streaks down from the heavens, glowing brighter as it falls!";
                            glowingBall = { x: random(100, width - 100), y: random(100, 300) };
                            showGlowingBall = true;
                            ballSource = 'star';
                        }
                        break;
                    case "Ask About the Sky Palace":
                        message = generateSkyLore();
                        break;
                }
            }
            messageTimer = 180;
            choices = []; // Clear choices after handling one
        }

        // The riddle's correct answer, and its pool of wrong answers, are
        // chosen fresh each visit (see pickRiddle), so this checks against
        // whichever riddle is currently active rather than a fixed string.
        function handleRiddleChoice(choice) {
            if (choice === currentRiddle.correct) {
                if (claimedRewards.has('riddle')) {
                    message = "\"You already proved your wisdom to me,\" the cat says warmly.";
                } else {
                    message = `"Yes!" the cat's eyes gleam. "${currentRiddle.correct} — the Starry Abyss opens to you!"`;
                    points += 10;
                    claimedRewards.add('riddle');
                }
            } else {
                message = pick(riddleWrongFlavor);
            }
        }

        function displayCoordinates() {
            fill(255);
            textSize(24);
            textAlign(LEFT, TOP);
            text(`x: ${mouseX}, y: ${mouseY}`, mouseX + 10, mouseY + 10);
        }

        function displayZoneName(name) {
            fill(0);
            textSize(48);
            textAlign(CENTER, CENTER);
            text(name, width / 2, height / 2);
        }

        function displayMessage(msg) {
            let boxPadding = 20;
            let boxWidth = 700;
            let textX = width / 2;
            let textY = height / 2;

            fill(255, 255, 0);
            textSize(32);
            textAlign(CENTER, CENTER);
            textStyle(BOLD);
            textWrap(WORD);
            text(msg, textX - boxWidth / 2 + boxPadding, textY, boxWidth - boxPadding * 2);
        }

        function displayChoices() {
            for (let i = 0; i < choices.length; i++) {
                let choiceY = height / 2 + 100 + i * 40;
                rectMode(CENTER);
                fill(200);
                rect(width / 2, choiceY, 400, 30);
                fill(0);
                textSize(20);
                textAlign(CENTER, CENTER);
                text(choices[i], width / 2, choiceY);
            }
            // Reset rectMode to CORNER for other drawings
            rectMode(CORNER);
        }

        function endGame() {
            gameEnded = true;
            document.getElementById('restart-btn').style.display = 'block';
        }

        function displayEndScreen() {
            fill(0, 0, 0, 150);
            rect(0, 0, width, height);

            fill(255);
            textSize(48);
            textAlign(CENTER, CENTER);
            text("Congratulations! You won!", width / 2, height / 2);
        }

        function restartGame() {
            points = 0;
            gameEnded = false;
            message = "";
            messageTimer = 0;
            choices = [];
            showGlowingBall = false;
            glowingBall = null;
            ballSource = null;
            activeCatIndex = -1;
            activeInteraction = null;
            currentRiddle = null;
            claimedRewards.clear();
            document.getElementById('restart-btn').style.display = 'none';
        }
    </script>
</body>
</html>
