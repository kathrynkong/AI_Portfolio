<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cats, Riddles &amp; Procedural Play</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at top, #fff6e9 0%, #f6e6cf 100%);
            font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
            color: #5b4636;
            padding: 24px;
        }

        .game-window {
            width: 100%;
            max-width: 640px;
            background: #fffaf2;
            border: 3px solid #e8c9a0;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(120, 80, 40, 0.15);
            padding: 20px 24px 28px;
        }

        .hud {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
        }

        .hud h1 {
            font-size: 1.3em;
            margin: 0;
            color: #a8622b;
        }

        .paw-tokens {
            background: #ffe9c7;
            border: 2px solid #e8c9a0;
            border-radius: 999px;
            padding: 6px 14px;
            font-weight: bold;
            font-size: 0.95em;
            transition: transform 0.2s ease;
        }

        .paw-tokens.pulse {
            animation: pulse 0.4s ease;
        }

        .badge {
            margin-left: 8px;
        }

        .cats-row {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }

        .cat-card {
            flex: 1 1 220px;
            max-width: 260px;
            background: #fff3e0;
            border: 3px solid #e8c9a0;
            border-radius: 16px;
            padding: 16px;
            text-align: center;
            cursor: pointer;
            font-family: inherit;
            color: inherit;
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }

        .cat-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 18px rgba(120, 80, 40, 0.18);
        }

        .cat-card.active {
            border-color: #e2823f;
            background: #ffe9c7;
        }

        .cat-card.bounce {
            animation: bounce 0.4s ease;
        }

        .cat-emoji {
            font-size: 3em;
            line-height: 1;
        }

        .cat-name {
            font-weight: bold;
            font-size: 1.1em;
            margin-top: 6px;
        }

        .cat-mood {
            display: inline-block;
            margin-top: 6px;
            padding: 2px 10px;
            border-radius: 999px;
            font-size: 0.8em;
            font-weight: bold;
        }

        .mood-Curious { background: #d6ecff; color: #29638a; }
        .mood-Sleepy { background: #e4e0f5; color: #5c4d8a; }
        .mood-Grumpy { background: #ffd9d0; color: #a8402a; }
        .mood-Playful { background: #fff0b3; color: #8a6d1a; }

        .scene-panel {
            background: #fdf0dc;
            border: 2px dashed #e0bd8c;
            border-radius: 14px;
            padding: 16px;
            min-height: 140px;
        }

        .speech-bubble {
            position: relative;
            background: #ffffff;
            border: 2px solid #e8c9a0;
            border-radius: 12px;
            padding: 12px 14px;
            font-size: 1em;
            line-height: 1.4;
            margin-bottom: 14px;
        }

        .speech-bubble.pop {
            animation: pop-in 0.25s ease;
        }

        .speech-bubble.shake {
            animation: shake 0.4s ease;
        }

        .choice-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .choice-btn {
            background: #e2823f;
            color: white;
            border: none;
            border-radius: 999px;
            padding: 10px 16px;
            font-size: 0.95em;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.2s ease, transform 0.15s ease;
        }

        .choice-btn:hover {
            background: #c96a2c;
            transform: translateY(-2px);
        }

        .riddle-card {
            flex: 1 1 150px;
            background: #ffffff;
            border: 2px solid #e8c9a0;
            border-radius: 12px;
            padding: 14px 10px;
            font-weight: bold;
            font-size: 1em;
            cursor: pointer;
            font-family: inherit;
            color: #5b4636;
            transition: transform 0.15s ease, border-color 0.2s ease;
        }

        .riddle-card:hover {
            transform: translateY(-3px);
            border-color: #e2823f;
        }

        .riddle-card.correct {
            animation: sparkle 0.5s ease;
            border-color: #4caf50;
            background: #eaf7ea;
        }

        .riddle-card.wrong {
            animation: shake 0.4s ease;
            border-color: #d9695a;
            background: #fbe9e7;
        }

        .replay-row {
            text-align: center;
            margin-top: 20px;
        }

        .replay-btn {
            background: #a8622b;
            color: white;
            border: none;
            border-radius: 999px;
            padding: 10px 20px;
            font-size: 0.95em;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
        }

        .replay-btn:hover {
            background: #8a4f22;
        }

        @keyframes bounce {
            0% { transform: translateY(0); }
            30% { transform: translateY(-10px); }
            60% { transform: translateY(0); }
            80% { transform: translateY(-4px); }
            100% { transform: translateY(0); }
        }

        @keyframes pop-in {
            0% { transform: scale(0.92); opacity: 0.4; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }

        @keyframes sparkle {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        @media (max-width: 480px) {
            .cats-row { flex-direction: column; align-items: center; }
            .cat-card { max-width: 100%; }
        }
    </style>
</head>
<body>
    <div class="game-window">
        <div class="hud">
            <h1>🐾 Cat Encounters</h1>
            <div class="paw-tokens" id="paw-tokens">Paw Tokens: <span id="paw-count">0</span><span class="badge" id="badge"></span></div>
        </div>

        <div class="cats-row" id="cats-row"></div>

        <div class="scene-panel">
            <div class="speech-bubble" id="speech-bubble">Click a cat to say hello.</div>
            <div class="choice-row" id="choice-row"></div>
        </div>

        <div class="replay-row">
            <button class="replay-btn" id="replay-btn">🔄 Play Again — it'll go differently next time</button>
        </div>
    </div>

    <script>
        // --- Game data -----------------------------------------------------
        // Each cat has its own personality, expressed as its own word banks
        // per action per mood. Procedural output is a function of
        // (cat personality, action, current mood, random pick) — not just a
        // single global pool of random sentences.
        const MOODS = ['Curious', 'Sleepy', 'Grumpy', 'Playful'];

        const cats = {
            mochi: {
                key: 'mochi',
                name: 'Mochi',
                emoji: '🐈',
                startMood: 'Curious',
                mood: 'Curious',
                actions: ['pet', 'treat', 'talk'],
                dialogue: {
                    greet: {
                        Curious: ["{cat} looks up at you, ears perked with interest."],
                        Sleepy: ["{cat} blinks slowly at you from a warm patch of sun."],
                        Grumpy: ["{cat} eyes you suspiciously from across the room."],
                        Playful: ["{cat} bounds over, tail high, ready for anything."]
                    },
                    pet: {
                        Grumpy: ["{cat} flattens her ears and swats at your hand — not today.", "{cat} backs away with a soft warning growl."],
                        Sleepy: ["{cat} cracks one eye open, allows a single pat, then dozes right back off.", "{cat} leans into your hand without fully waking up."],
                        Curious: ["{cat} sniffs your fingers thoroughly before allowing a scratch behind the ears.", "{cat} tilts her head, studying you, then permits a gentle pat."],
                        Playful: ["{cat} headbutts your hand and rolls over for belly rubs.", "{cat} purrs loudly and bats playfully at your sleeve."]
                    },
                    treatSuccess: {
                        Grumpy: ["{cat} cautiously sniffs the salmon treat, then decides you may be acceptable after all."],
                        Sleepy: ["{cat} opens one eye, sniffs the treat, and accepts it without much enthusiasm."],
                        Curious: ["{cat} inspects the treat from every angle before accepting it with quiet approval."],
                        Playful: ["{cat} pounces on the treat like it's the best thing that's ever happened to her."]
                    },
                    treatSteal: ["{cat} snatches the treat and bolts under the couch, pretending you were never here.", "{cat} grabs the treat and retreats to a corner, eyeing you the whole time."],
                    talk: {
                        Grumpy: ["{cat} flicks her tail and looks away — clearly not in a chatting mood."],
                        Sleepy: ["{cat} answers with a slow blink, too drowsy for real conversation."],
                        Curious: ["{cat} tilts her head, seemingly considering your question very seriously."],
                        Playful: ["{cat} bats at your hand mid-sentence, more interested in play than talk."]
                    }
                }
            },
            paws: {
                key: 'paws',
                name: 'Professor Paws',
                emoji: '🐈‍⬛',
                startMood: 'Sleepy',
                mood: 'Sleepy',
                actions: ['pet', 'talk', 'riddle'],
                dialogue: {
                    greet: {
                        Curious: ["{cat} regards you over the rim of an invisible pair of spectacles."],
                        Sleepy: ["{cat} is curled up mid-nap and only half acknowledges you."],
                        Grumpy: ["{cat} sighs, as if your presence interrupts something important."],
                        Playful: ["{cat} sets aside his dignity for a moment, tail twitching with interest."]
                    },
                    pet: {
                        Grumpy: ["{cat} narrows his eyes and steps just out of reach.", "{cat} issues a single, unimpressed hiss."],
                        Sleepy: ["{cat} barely stirs, tolerating the pat with visible effort.", "{cat} allows one pat before returning to his nap."],
                        Curious: ["{cat} studies your hand like a specimen before allowing contact.", "{cat} permits a scratch, clearly evaluating you as he does."],
                        Playful: ["{cat} surprises you with an actual purr and a headbutt.", "{cat} swats at your hand — playfully, for once."]
                    },
                    talk: {
                        Grumpy: ["{cat} sighs. \"A question? Really?\" — and says nothing further."],
                        Sleepy: ["{cat} mumbles something about \"later\" and closes his eyes."],
                        Curious: ["{cat} considers your question with genuine academic interest."],
                        Playful: ["{cat} answers your question with a riddle of his own, delighted."]
                    },
                    riddleWrong: ["{cat} yawns. \"Try again, seeker.\"", "{cat} shakes his head slowly. \"Not quite.\"", "{cat} looks unimpressed. \"Do better.\""]
                }
            }
        };

        const riddleBank = [
            { question: "What shines in the dark but can never be held?", correct: "A Star", distractors: ["The Moon", "A Flame"] },
            { question: "What grows brighter the longer you refuse to look at it?", correct: "A Star", distractors: ["A Shadow", "A Candle"] },
            { question: "What falls every night, yet nothing ever lands?", correct: "Starlight", distractors: ["Rain", "Snow"] },
            { question: "What has nine lives but only one true nap schedule?", correct: "A Cat", distractors: ["A Ghost", "A Clock"] },
            { question: "What can you offer freely that is rarely accepted?", correct: "Advice", distractors: ["A Treat", "A Nap"] }
        ];

        const actionLabels = { pet: 'Pet', treat: 'Offer a Treat', talk: 'Ask a Question', riddle: 'Solve a Riddle' };

        // Mood shifts are looked up by action, so the same click can move a
        // cat toward or away from a friendlier state depending on where it
        // already is: petting a Grumpy cat keeps it Grumpy (no reward),
        // while warming it up with a treat first opens the door to a
        // rewarding pet later.
        const petMoodNext = { Grumpy: 'Grumpy', Sleepy: 'Sleepy', Curious: 'Playful', Playful: 'Playful' };
        const treatMoodNext = { Grumpy: 'Curious', Sleepy: 'Curious', Curious: 'Playful', Playful: 'Playful' };
        const treatStealChance = { Grumpy: 0.4, Sleepy: 0.25, Curious: 0.15, Playful: 0.1 };

        let pawTokens = 0;
        let riddlesSolved = 0;
        let activeCatKey = null;
        let activeRiddle = null;

        const el = {
            catsRow: document.getElementById('cats-row'),
            speech: document.getElementById('speech-bubble'),
            choices: document.getElementById('choice-row'),
            pawCount: document.getElementById('paw-count'),
            pawTokens: document.getElementById('paw-tokens'),
            badge: document.getElementById('badge'),
            replayBtn: document.getElementById('replay-btn')
        };

        function pick(list) {
            return list[Math.floor(Math.random() * list.length)];
        }

        function shuffle(list) {
            const result = list.slice();
            for (let i = result.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [result[i], result[j]] = [result[j], result[i]];
            }
            return result;
        }

        function line(cat, pool) {
            return pick(pool).replace(/\{cat\}/g, cat.name);
        }

        function awardTokens(amount) {
            pawTokens += amount;
            el.pawCount.textContent = pawTokens;
            el.pawTokens.classList.remove('pulse');
            void el.pawTokens.offsetWidth; // restart animation
            el.pawTokens.classList.add('pulse');
            if (riddlesSolved >= 3) {
                el.badge.textContent = ' 🏅 Riddle Sage';
            }
        }

        function say(text, animation) {
            el.speech.textContent = text;
            el.speech.classList.remove('pop', 'shake');
            void el.speech.offsetWidth;
            el.speech.classList.add(animation || 'pop');
        }

        function renderCats() {
            el.catsRow.innerHTML = '';
            Object.values(cats).forEach(cat => {
                const card = document.createElement('button');
                card.type = 'button';
                card.className = 'cat-card' + (cat.key === activeCatKey ? ' active' : '');
                card.innerHTML = `
                    <div class="cat-emoji">${cat.emoji}</div>
                    <div class="cat-name">${cat.name}</div>
                    <div class="cat-mood mood-${cat.mood}">${cat.mood}</div>
                `;
                card.addEventListener('click', () => selectCat(cat.key, card));
                el.catsRow.appendChild(card);
            });
        }

        function selectCat(key, cardEl) {
            activeCatKey = key;
            activeRiddle = null;
            const cat = cats[key];
            renderCats();
            if (cardEl) {
                const freshCard = el.catsRow.children[Object.keys(cats).indexOf(key)];
                freshCard.classList.add('bounce');
            }
            say(line(cat, cat.dialogue.greet[cat.mood]), 'pop');
            renderChoices();
        }

        function renderChoices() {
            el.choices.innerHTML = '';
            const cat = cats[activeCatKey];
            if (!cat) return;
            cat.actions.forEach(action => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'choice-btn';
                btn.textContent = actionLabels[action];
                btn.addEventListener('click', () => handleAction(action));
                el.choices.appendChild(btn);
            });
        }

        function handleAction(action) {
            const cat = cats[activeCatKey];
            if (action === 'pet') handlePet(cat);
            else if (action === 'treat') handleTreat(cat);
            else if (action === 'talk') handleTalk(cat);
            else if (action === 'riddle') startRiddle(cat);
        }

        function handlePet(cat) {
            const nextMood = petMoodNext[cat.mood];
            const rewarded = nextMood === 'Playful' && cat.mood !== 'Grumpy' && cat.mood !== 'Sleepy';
            const msg = line(cat, cat.dialogue.pet[cat.mood]);
            cat.mood = nextMood;
            renderCats();
            say(msg, 'pop');
            if (rewarded) awardTokens(1);
        }

        function handleTreat(cat) {
            const stealRoll = Math.random();
            if (stealRoll < treatStealChance[cat.mood]) {
                say(line(cat, cat.dialogue.treatSteal), 'shake');
                return;
            }
            const nextMood = treatMoodNext[cat.mood];
            const msg = line(cat, cat.dialogue.treatSuccess[cat.mood]);
            cat.mood = nextMood;
            renderCats();
            say(msg, 'pop');
            awardTokens(1);
        }

        function handleTalk(cat) {
            say(line(cat, cat.dialogue.talk[cat.mood]), 'pop');
        }

        function startRiddle(cat) {
            activeRiddle = riddleBank[Math.floor(Math.random() * riddleBank.length)];
            say(activeRiddle.question, 'pop');
            renderRiddleChoices(cat);
        }

        function renderRiddleChoices(cat) {
            el.choices.innerHTML = '';
            const options = shuffle([activeRiddle.correct, ...activeRiddle.distractors]);
            options.forEach(option => {
                const card = document.createElement('button');
                card.type = 'button';
                card.className = 'riddle-card';
                card.textContent = option;
                card.addEventListener('click', () => handleRiddleAnswer(cat, option, card));
                el.choices.appendChild(card);
            });
        }

        function handleRiddleAnswer(cat, option, cardEl) {
            if (option === activeRiddle.correct) {
                cardEl.classList.add('correct');
                riddlesSolved++;
                cat.mood = 'Playful';
                renderCats();
                say(`${cat.emoji} "${activeRiddle.correct}" — correct! ${cat.name}'s eyes gleam with approval.`, 'pop');
                awardTokens(2);
                activeRiddle = null;
                setTimeout(() => renderChoices(), 700);
            } else {
                cardEl.classList.add('wrong');
                say(line(cat, cat.dialogue.riddleWrong || ["Try again."]), 'shake');
                setTimeout(() => startRiddle(cat), 500);
            }
        }

        function resetGame() {
            pawTokens = 0;
            riddlesSolved = 0;
            activeCatKey = null;
            activeRiddle = null;
            el.pawCount.textContent = '0';
            el.badge.textContent = '';
            Object.values(cats).forEach(cat => { cat.mood = cat.startMood; });
            renderCats();
            el.choices.innerHTML = '';
            say("Click a cat to say hello.", 'pop');
        }

        el.replayBtn.addEventListener('click', resetGame);

        renderCats();
    </script>
</body>
</html>
