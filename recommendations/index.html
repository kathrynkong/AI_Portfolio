<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Switch Game Recommender</title>
    <style>
        body {
            font-family: 'Press Start 2P', cursive, Arial, sans-serif;
            background-color: #1a1a1a;
            color: #33ff33;
            padding: 20px;
            text-align: center;
            max-width: 1000px;
            margin: auto;
        }
        .game-container {
            background-color: #333;
            border: 2px solid #66ff66;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.5);
        }
        .game-title {
            font-size: 1.5em;
            margin-bottom: 10px;
            color: #ffcc00;
        }
        .rating {
            margin-top: 10px;
        }
        .action-btn {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 1em;
            cursor: pointer;
            background-color: #66ff66;
            color: #1a1a1a;
            border: none;
            border-radius: 4px;
            transition: background-color 0.3s;
        }
        .action-btn:hover {
            background-color: #33cc33;
        }
        #top-genres, #recommendations {
            margin-top: 20px;
            background-color: #262626;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.3);
        }
        h1 {
            font-size: 2em;
            color: #ffcc00;
            text-shadow: 2px 2px #ff0000;
        }
        label {
            font-size: 0.9em;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <h1>Switch Game Recommender</h1>
    <div id="games"></div>
    <div id="preferences"></div>
    <button id="submit-btn" class="action-btn" onclick="displayTopGenresAndRecommendations()">Submit Ratings</button>
    <div id="top-genres"></div>
    <div id="recommendations"></div>
    <button id="more-btn" class="action-btn" onclick="loadMoreGames()" style="display:none;">Rate More Games</button>

    <script>
        let allGames = [];
        const ratedGames = new Set();
        const BATCH_SIZE = 5;

        // Content-based recommender: every game is represented as a one-hot
        // feature vector over genre/player-mode/ESRB-rating tokens, and your
        // ratings accumulate into a preference vector in that same space.
        // Recommendations are ranked by cosine similarity between the two.
        let vocab = null;
        let userProfile = null;

        fetch('./Switchgame.json')
            .then(response => response.json())
            .then(gamesJson => {
                allGames = gamesJson;
                vocab = buildVocabulary(allGames);
                loadNextBatch();
            })
            .catch(error => console.error('Error fetching JSON:', error));

        function splitTokens(value) {
            return String(value).split(/[\/,]/).map(s => s.trim()).filter(Boolean);
        }

        function buildVocabulary(games) {
            const genres = new Set();
            const players = new Set();
            const ratings = new Set();
            games.forEach(game => {
                splitTokens(game.genre).forEach(t => genres.add(t));
                splitTokens(game.players).forEach(t => players.add(t));
                ratings.add(game.esrb_rating);
            });
            return { genres: [...genres], players: [...players], ratings: [...ratings] };
        }

        function featureVector(game, vocabulary) {
            const genreSet = new Set(splitTokens(game.genre));
            const playerSet = new Set(splitTokens(game.players));
            const vec = [];
            vocabulary.genres.forEach(g => vec.push(genreSet.has(g) ? 1 : 0));
            vocabulary.players.forEach(p => vec.push(playerSet.has(p) ? 1 : 0));
            vocabulary.ratings.forEach(r => vec.push(game.esrb_rating === r ? 1 : 0));
            return vec;
        }

        function cosineSimilarity(a, b) {
            let dot = 0, magA = 0, magB = 0;
            for (let i = 0; i < a.length; i++) {
                dot += a[i] * b[i];
                magA += a[i] * a[i];
                magB += b[i] * b[i];
            }
            if (magA === 0 || magB === 0) return 0;
            return dot / (Math.sqrt(magA) * Math.sqrt(magB));
        }

        // Top genre tokens in the user's preference vector, for display.
        function topGenrePreferences(limit) {
            if (!userProfile) return [];
            return vocab.genres
                .map((genre, i) => [genre, userProfile[i]])
                .filter(([, score]) => score > 0)
                .sort((a, b) => b[1] - a[1])
                .slice(0, limit || vocab.genres.length);
        }

        function escapeHtml(value) {
            return String(value).replace(/[&<>"']/g, ch => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[ch]));
        }

        // Unbiased Fisher-Yates shuffle (Array.sort(() => Math.random() - 0.5) is not uniform)
        function shuffle(array) {
            const result = array.slice();
            for (let i = result.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [result[i], result[j]] = [result[j], result[i]];
            }
            return result;
        }

        function loadNextBatch() {
            document.getElementById('more-btn').style.display = 'none';
            const unratedGames = allGames.filter(game => !ratedGames.has(game.title));
            if (unratedGames.length === 0) {
                document.getElementById('games').innerHTML = "<p>You've rated every game we have! Check your recommendations above.</p>";
                return;
            }
            displayGames(shuffle(unratedGames).slice(0, BATCH_SIZE));
        }

        function loadMoreGames() {
            loadNextBatch();
            document.getElementById('games').scrollIntoView({ behavior: 'smooth' });
        }

        function displayGames(games) {
            const gamesContainer = document.getElementById('games');
            gamesContainer.innerHTML = '';
            games.forEach(game => {
                ratedGames.add(game.title);
                const gameDiv = document.createElement('div');
                gameDiv.classList.add('game-container');

                gameDiv.innerHTML = `
                    <div class="game-title">${escapeHtml(game.title)}</div>
                    <div>Developer: ${escapeHtml(game.developer)}</div>
                    <div>Publisher: ${escapeHtml(game.publisher)}</div>
                    <div>Year: ${escapeHtml(game.year)}</div>
                    <div>Genre: ${escapeHtml(game.genre)}</div>
                    <div>Number of Players: ${escapeHtml(game.players)}</div>
                    <div>ESRB Rating: ${escapeHtml(game.esrb_rating)}</div>
                    <div>Supported Languages: ${escapeHtml(game.supported_languages.join(', '))}</div>
                    <div class="rating">
                        <label>Rate this game:</label><br>
                        <label><input type="radio" name="rating-${escapeHtml(game.title)}" value="1"> 1</label>
                        <label><input type="radio" name="rating-${escapeHtml(game.title)}" value="2"> 2</label>
                        <label><input type="radio" name="rating-${escapeHtml(game.title)}" value="3"> 3</label>
                        <label><input type="radio" name="rating-${escapeHtml(game.title)}" value="4"> 4</label>
                        <label><input type="radio" name="rating-${escapeHtml(game.title)}" value="5"> 5</label>
                        <label><input type="radio" name="rating-${escapeHtml(game.title)}" value="haven't played"> Haven't played it</label>
                    </div>
                `;

                gameDiv.querySelectorAll('.rating input[type="radio"]').forEach(input => {
                    input.addEventListener('change', () => handleRating(game, input.value));
                });

                gamesContainer.appendChild(gameDiv);
            });
        }

        // A rating moves the preference vector toward (5) or away from (1)
        // this game's feature vector; 3 is neutral and leaves it untouched.
        function handleRating(game, ratingValue) {
            const rating = Number(ratingValue);
            if (Number.isNaN(rating)) return; // "haven't played"
            const vec = featureVector(game, vocab);
            if (!userProfile) userProfile = new Array(vec.length).fill(0);
            const weight = (rating - 3) / 2;
            for (let i = 0; i < vec.length; i++) {
                userProfile[i] += weight * vec[i];
            }
            updatePreferencesDisplay();
        }

        function updatePreferencesDisplay() {
            const preferencesContainer = document.getElementById('preferences');
            preferencesContainer.innerHTML = '<h2>Genre Preferences</h2>';
            const top = topGenrePreferences(6);
            if (top.length === 0) {
                preferencesContainer.innerHTML += '<div>Rate a game 3 stars or higher to start building your taste profile.</div>';
                return;
            }
            top.forEach(([genre, score]) => {
                preferencesContainer.innerHTML += `<div>${escapeHtml(genre)}: ${score.toFixed(2)}</div>`;
            });
        }

        function displayTopGenresAndRecommendations() {
            const topGenresContainer = document.getElementById('top-genres');
            const recommendationsContainer = document.getElementById('recommendations');
            const moreBtn = document.getElementById('more-btn');

            const top = topGenrePreferences(3);
            topGenresContainer.innerHTML = '<h2>Top Genres Based on Your Ratings</h2>';
            if (top.length === 0) {
                topGenresContainer.innerHTML += '<div>Rate a few games 3 stars or higher to see your top genres.</div>';
                recommendationsContainer.innerHTML = '';
                moreBtn.style.display = 'inline-block';
                return;
            }
            top.forEach(([genre, score]) => {
                topGenresContainer.innerHTML += `<div>${escapeHtml(genre)}: ${score.toFixed(2)}</div>`;
            });

            // Rank every unrated game by cosine similarity to your
            // preference vector — a real (if classical) content-based
            // recommendation technique, not a hardcoded genre lookup.
            const scored = allGames
                .filter(game => !ratedGames.has(game.title))
                .map(game => ({ game, score: cosineSimilarity(userProfile, featureVector(game, vocab)) }))
                .filter(entry => entry.score > 0)
                .sort((a, b) => b.score - a.score)
                .slice(0, 3);

            recommendationsContainer.innerHTML = '<h2>Recommended Games for You</h2>';
            if (scored.length === 0) {
                recommendationsContainer.innerHTML += '<div>No recommendations available — try rating a few more games.</div>';
            } else {
                scored.forEach(({ game, score }) => {
                    recommendationsContainer.innerHTML += `
                        <div class="game-container">
                            <div class="game-title">${escapeHtml(game.title)}</div>
                            <div>Developer: ${escapeHtml(game.developer)}</div>
                            <div>Publisher: ${escapeHtml(game.publisher)}</div>
                            <div>Year: ${escapeHtml(game.year)}</div>
                            <div>Genre: ${escapeHtml(game.genre)}</div>
                            <div>Number of Players: ${escapeHtml(game.players)}</div>
                            <div>ESRB Rating: ${escapeHtml(game.esrb_rating)}</div>
                            <div>Supported Languages: ${escapeHtml(game.supported_languages.join(', '))}</div>
                            <div>Match: ${(score * 100).toFixed(0)}%</div>
                        </div>
                    `;
                });
            }

            moreBtn.style.display = 'inline-block';
        }
    </script>
</body>
</html>
